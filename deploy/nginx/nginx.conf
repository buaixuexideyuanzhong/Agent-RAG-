# 活动策划系统 - Nginx 生产配置
#
# 职责：前端静态托管 + /api 反向代理到后端（负载均衡）
#
# 负载均衡（两层）：
#   1. 每节点内：uvicorn --workers N，单容器内多进程并行（见 compose.prod.yml）
#   2. 跨节点：nginx 通过 Docker 内嵌 DNS(127.0.0.11) 对 backend 服务名轮询解析。
#      横向扩容：docker compose -f compose.prod.yml up -d --scale backend=N
#
# SSE 要点：/api/v1/plan/stream 必须 proxy_buffering off，否则流式内容被缓冲不实时。

user  nginx;
worker_processes  auto;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # 压缩（方案正文是 markdown 文本，压缩收益大）
    gzip            on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript image/svg+xml text/xml;

    # Docker 内嵌 DNS：--scale backend=N 时按副本轮询解析，实现跨节点负载均衡。
    # 注意：nginx 会按 valid 缓存解析结果——valid 越小，新请求切换节点越勤。
    # SSE 长连接天然全程粘在一个节点上（必须），间隔数秒的新会话才会轮转到不同副本，
    # 故用 1s（突发同秒请求会短暂同节点，属正常）。
    resolver 127.0.0.11 valid=1s ipv6=off;

    # ---------- 经典 upstream 池写法（keepalive 复用连接）----------
    # 默认走上面的 Docker DNS 轮询；如需固定节点列表，取消注释并逐个加 server：
    # upstream backend_pool {
    #     server backend:8000 max_fails=3 fail_timeout=30s;
    #     keepalive 32;
    # }

    server {
        listen       80;
        server_name  _;

        # 前端静态资源（Vite 构建产物 frontend/dist）
        root   /usr/share/nginx/html;
        index  index.html;

        # SPA 路由回退
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的静态资源可长期缓存
        location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ===== SSE 流式策划：关缓冲 + 长读超时 =====
        location /api/v1/plan/stream {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;          # SSE 必须关缓冲，逐字实时透传
            proxy_cache off;
            proxy_read_timeout 300s;      # 后端无心跳，读超时给足
            proxy_send_timeout 300s;
        }

        # ===== 其余 API（普通 JSON） =====
        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
